<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dev Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --primary: #58a6ff;
            --primary-hover: #3182ce;
            --card-bg: #161b22;
            --border: #30363d;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 50px;
        }
        
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subheading {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input {
            flex: 1;
            padding: 15px 20px;
            background-color: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: var(--primary);
        }
        
        button {
            padding: 15px 30px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 14px rgba(88, 166, 255, 0.3);
        }
        
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 166, 255, 0.4);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
        
        .skeleton {
            height: 300px;
            background: linear-gradient(90deg, var(--card-bg) 25%, var(--border) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .result-area {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            margin-top: 30px;
            position: relative;
        }
        
        .result-area.visible {
            display: block;
            opacity: 1;
        }
        
        .share-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            font-size: 0.9rem;
            box-shadow: none;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }
        
        .share-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        .error {
            display: none;
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #ff7b72;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GitHub Dev Card</h1>
    <div class="subheading">Enter any public GitHub username to reveal their persona.</div>
    
    <div class="input-group">
        <input type="text" id="username" placeholder="@username" onkeypress="handleKeyPress(event)">
        <button id="generateBtn" onclick="generateCard()">Generate &rarr;</button>
    </div>
    
    <div id="error" class="error"></div>
    
    <div id="loading" class="loading">
        <p>Analyzing profile...</p>
        <div class="skeleton"></div>
    </div>
    
    <div id="result" class="result-area">
        <button class="share-btn" onclick="copyUrl()">🔗 Share</button>
        <div id="card-container"></div>
    </div>
</div>

<script>
    // In production, this will be replaced by envsubst in Docker container
    // However, it falls back to window.location.origin if it's served from same domain,
    // or we use the specific backend URL if injected.
    const BACKEND_URL = "${BACKEND_URL}" !== "${" + "BACKEND_URL" + "}" ? "${BACKEND_URL}" : "http://localhost:8080";
    
    let currentCardUrl = "";

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            generateCard();
        }
    }

    async function generateCard() {
        const usernameInput = document.getElementById('username').value.trim().replace('@', '');
        if (!usernameInput) return;
        
        const errorEl = document.getElementById('error');
        const loadingEl = document.getElementById('loading');
        const resultEl = document.getElementById('result');
        const btn = document.getElementById('generateBtn');
        const cardContainer = document.getElementById('card-container');
        
        // Reset state
        errorEl.style.display = 'none';
        resultEl.classList.remove('visible');
        setTimeout(() => resultEl.style.display = 'none', 300);
        loadingEl.style.display = 'block';
        btn.disabled = true;
        btn.innerText = 'Generating...';
        
        try {
            const url = BACKEND_URL === "/" ? "/generate" : `${BACKEND_URL}/generate`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.detail || 'Failed to generate card');
            }
            
            if (data.html) {
                cardContainer.innerHTML = data.html;
                currentCardUrl = (BACKEND_URL === "/" ? window.location.origin : BACKEND_URL) + data.url;
                
                loadingEl.style.display = 'none';
                resultEl.style.display = 'block';
                // Trigger reflow
                void resultEl.offsetWidth;
                resultEl.classList.add('visible');
            } else {
                throw new Error("No card generated. Try again.");
            }
            
        } catch (err) {
            loadingEl.style.display = 'none';
            errorEl.innerText = err.message;
            errorEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Generate &rarr;';
        }
    }
    
    function copyUrl() {
        if (currentCardUrl) {
            navigator.clipboard.writeText(currentCardUrl).then(() => {
                const btn = document.querySelector('.share-btn');
                const originalText = btn.innerText;
                btn.innerText = '✅ Copied!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            });
        }
    }
</script>
</body>
</html>
